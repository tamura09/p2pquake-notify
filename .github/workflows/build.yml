name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCOUNT_ID: "222165754930"
  AWS_REGION: ap-northeast-1
  AWS_ROLE_TO_ASSUME: "arn:aws:iam::222165754930:role/github-actions-p2pquake-notify"
  ECR_REPOSITORY: p2pquake-notify
  ECS_CLUSTER: p2pquake-notify
  ECS_SERVICE: p2pquake-notify

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  deploy:
    name: Deploy
    needs: test
    # workflow_dispatch も通します。コードを変えずに再デプロイしたい時があるためです。
    # Fargate のプラットフォーム更新でタスクが退役する時など、入れ替わる瞬間を自分で
    # 選びたい場面がそれにあたります(このサービスは新旧のタスクを重ねない設定なので、
    # 入れ替えの間は通知が止まります。起きている時間に済ませたい)。
    #
    # ここを push 限定にしておくと、その操作をするのに手元でアカウントの認証情報を
    # 使うことになります。このジョブが assume するロールは ECR の p2pquake-notify
    # リポジトリと、ECS の同名サービスへの UpdateService だけに絞られています。
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # QEMU も buildx のマルチプラットフォーム設定も要りません。Dockerfile が
      # ランナー上でクロスコンパイルし、arm64 の層はバイナリのコピーだけだからです。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # タスク定義は Terraform が :latest を指したまま所有しています。ここでは
      # 新しいイメージを引かせるためにサービスの再デプロイを促すだけで、
      # タスク定義そのものは書き換えません(Terraform と取り合いになるため)。
      - name: Redeploy ECS service
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --no-cli-pager > /dev/null
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"
